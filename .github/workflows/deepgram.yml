# Scores a spoken sample call through the real Deepgram API (recording upload,
# stereo and mono, plus a live stream). Uses the DEEPGRAM_API_KEY repository
# secret and costs roughly ten cents per run.
#
# The key is only handed to trusted code: merged code on main, or a run someone
# with write access starts by hand (Actions tab -> Run workflow -> pick a branch).
# It never runs automatically on pull requests, whose code could print the key.
name: Deepgram smoke test
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - src/stt/**
      - src/server/live.ts
      - src/server/pipeline.ts
      - scripts/deepgram-smoke.mjs
      - src/rubrics/**
      - src/engine/**
      - package-lock.json
      - .github/workflows/deepgram.yml

jobs:
  deepgram:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build:api
      - name: Score a spoken call through real Deepgram
        env:
          DEEPGRAM_API_KEY: ${{ secrets.DEEPGRAM_API_KEY }}
        run: node --disable-warning=ExperimentalWarning scripts/deepgram-smoke.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: deepgram-smoke-report
          path: deepgram-smoke-report.json
          if-no-files-found: ignore
